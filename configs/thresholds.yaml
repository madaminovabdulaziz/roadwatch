# RoadWatch tunables — every number the pipeline uses lives here (CLAUDE.md rule), never in code.
# Units unless stated: seconds, metres, m/s, m/s^2, degrees, degrees/s. Source of each default: docs/SPEC.md.
#
# Class enable policy (SPEC §7): a class is emitted only if `enabled: true` here AND the scene has the
# geometry it needs. Every class starts disabled; flip one on only after its rule passes the §7 checks.
# Predicting a class that is absent from the test set adds a class with F1 = 0 to Score A.

seed: 0

video:
  stride_part_a: 3            # process every 3rd frame for Part A (~10 fps at 29.97 fps)
  stride_refine: 1            # boundary refinement reads full frame rate
  max_consecutive_errors: 30  # undecodable packets/frames in a row before a reader gives up
  skip_nonref: true           # Part A never decodes B-frames (SPEC §12.18)

perception:                   # SPEC §3, §12.18-12.21
  model: yolo11m              # weights/<model>.torchscript + .json (scripts/fetch_weights.py)
  imgsz: 960                  # network input long side; the 16:9 frames become 960x544
  conf_min: 0.1               # every detection >= this goes to ByteTrack (its low-score pass)
  nms_iou: 0.7
  max_det: 300
  half: true                  # FP16 on CUDA; FP32 on CPU
  batch_size: 8
  prefetch_frames: 32         # decoded frames buffered ahead of the detector (decode thread)
  keep_classes:               # COCO id -> our class name
    0: person
    1: bicycle
    2: car
    3: motorcycle
    5: bus
    7: truck
    14: bird
    15: cat
    16: dog
    17: horse
    18: sheep
    19: cow
    24: backpack
    28: suitcase
  tracker_groups:             # one ByteTrack per group so ids never jump across types; NMS per group too
    vehicles: [car, bus, truck]
    two_wheelers: [bicycle, motorcycle]
    persons: [person]
    others: [bird, cat, dog, horse, sheep, cow, backpack, suitcase]
  bytetrack:
    track_activation_threshold: 0.25
    lost_track_buffer_sec: 1.0
    minimum_matching_threshold: 0.8

kinematics:                   # SPEC §3
  savgol_window_sec: 1.2      # offline smoothing (Part A)
  savgol_order: 2
  ema_alpha: 0.5              # online smoothing (Part B)
  min_track_sec: 1.0          # shorter tracks get kin_valid = False
  edge_margin_frac: 0.004     # boxes this close to the frame border are clipped: no kinematics (SPEC §12.38)
  heading_min_speed_mps: 1.0  # below this the heading is noise: hold the last one, yaw_rate = 0
  persistence_max_gap_sec: 3.0
  persistence_max_dist_m: 2.0
  persistence_max_speed_mps: 0.5  # only tracks this slow at the break are linked (stationary objects)
  vehicle_dims_m:             # ground-plane box per class, [length, width] (SPEC §12.35); others are points
    car: [4.6, 1.8]
    truck: [6.5, 2.3]         # COCO "truck" here is mostly pickups, vans and light lorries
    bus: [12.0, 2.55]         # articulated buses are 18 m: their front point is a lower bound when receding
    motorcycle: [2.1, 0.8]
    bicycle: [1.8, 0.6]

lane_flow:                    # RUNBOOK P1.2 (roadwatch/scene/flow.py, scripts/learn_lane_flow.py); pixels are native
  min_speed_px_s: 40.0        # slower image motion is jitter, not driving (about 1 m/s near the camera at 4K)
  min_samples: 30             # a lane needs this many moving steps before a direction is proposed
  min_consistency: 0.7        # length of the mean unit vector; lower = traffic in the lane disagrees
  cell_px: 120                # flow-field grid cell for the EDA page
  min_cell_samples: 5

signal:                       # SPEC §4 / RUNBOOK P1.2 (roadwatch/scene/light.py)
  median_sec: 0.5             # majority filter over this window (centred offline, trailing online)
  hue_ranges:                 # OpenCV hue 0-179 of a lit lamp
    red: [[0, 10], [170, 180]]
    yellow: [[15, 35]]
    green: [[40, 100]]
  min_saturation: 80          # pixels less saturated than this do not count as lamp colour
  lit_min_value: 0.25         # ... nor pixels darker than this share of full brightness (colour excess)
  lit_fraction: 0.15          # a lamp whose colour excess reaches this is lit (absolute test, SPEC §12.36)
  fallback_min_excess: 0.05   # the relative test needs at least this much of the lamp's colour in its box
  min_contrast: 0.1           # a lamp whose score never varies more than this is never judged lit
  lit_threshold: 0.5          # the brightest lamp is lit if its score is past this share of its range
  baseline_percentiles: [5, 95]  # offline per-lamp "off" and "on" levels
  flow:                       # fallback when a signal has no lamp boxes (low confidence)
    bin_sec: 1.0
    moving_speed_mps: 2.0
    stopped_speed_mps: 0.5
    queue_m: 20.0             # vehicles this close upstream of the stop line count as waiting

registration:                 # SPEC §12.34: map the scene (clicked on the reference frame) into each video
  work_width: 1920              # both images are matched at this width
  frames: 5                     # Part A: frames spread over the video, median = background without traffic
  sift_features: 6000
  ratio: 0.7                    # Lowe ratio test
  ransac_px: 2.0                # RANSAC reprojection threshold at work_width
  min_inliers: 40
  min_inlier_ratio: 0.3
  max_corner_shift_frac: 0.15   # a frame corner moving more than this share of the width is not the same camera angle
  online_retry_sec: 2.0         # Part B: a new frame joins the registration sample this often ...
  online_max_frames: 5          # ... until the fit is confident or this many frames were tried

events:                       # shared by the rules (roadwatch/events/common.py)
  max_gap_sec: 1.0            # a hole in a track up to this long does not split a run (SPEC §12.37)

runtime:                      # SPEC §11 and §12 (time budget)
  part_a_deadline_factor: 1.2 # Part A stops refining and returns what it has after this x duration
  perception_budget_factor: 1.0  # Part A perception paces itself to finish within this x duration
  max_frame_skip: 6           # when projected to overrun, detect only every k-th decoded frame, k <= this
  pace_after_sec: 10.0        # ... judged on the rate after this much video (warm-up is not the rate; SPEC §12.56)
  refine_budget_frac: 0.15    # skip refinement if it would read more than this share of frames

postprocess:                  # SPEC §6; per-class values below override these defaults
  merge_gap: 1.0
  min_dur: 0.5
  refine_window_sec: 2.0
  refine_classes: [accident, red_light, solid_line_crossing, failure_to_yield, near_miss]
  round_decimals: 3

classes:                      # SPEC §5 (triggers) and §6 (merge_gap, min_dur)
  accident:
    enabled: true
    min_score: 0.5
    merge_gap: 1.0
    min_dur: 0.8
    params:
      contact_dist_m: 1.5
      shock_window_sec: 0.6
      shock_decel_mps2: 6.0
      shock_heading_deg: 30.0
      shock_heading_window_sec: 1.0
      shock_min_track_age_sec: 1.0  # no braking/heading shock from a track's first second (a box being revealed)
      shock_heading_min_speed_mps: 3.0  # a sudden turn counts only for a vehicle moving at least this fast
      reid_max_gap_sec: 0.5       # a track starting this soon where another ended is that track re-identified
      max_ground_m_per_px: 0.08   # judged only where one 4K-equivalent pixel is at most this much road (§12.53)
      confirm_stopped_sec: 3.0
      single_speed_before_mps: 8.0
      single_speed_after_mps: 1.0
      single_window_sec: 1.5
      end_speed_mps: 0.3
      end_hold_sec: 2.0
      confirm_speed_mps: 1.0        # "stays stopped" for the confirmation means slower than this
      confirm_within_sec: 3.0       # the stop (or the disappearance) must begin this soon after contact
      fall_aspect_upright: 1.5      # person box height/width before a fall...
      fall_aspect_down: 1.0         # ...and after it

  near_miss:
    enabled: false
    min_score: 0.5
    merge_gap: 1.0
    min_dur: 0.5
    params:
      max_ttc_sec: 1.5
      min_closing_speed_mps: 3.0
      evasive_decel_mps2: 4.0
      evasive_yaw_rate_dps: 25.0
      min_separation_m: 1.5
      no_accident_within_sec: 3.0
      onset_decel_mps2: 2.0
      end_ttc_sec: 3.0
      evasive_window_sec: 2.0       # evasive action is searched this long before and after the TTC trigger

  red_light:
    enabled: true
    min_score: 0.5
    merge_gap: 1.0
    min_dur: 0.5
    params:
      red_stable_sec: 3.0         # real red phases last > 10 s; shorter "reds" are occlusions (SPEC §12.36)
      min_after_red_onset_sec: 0.5
      max_entry_sec: 3.0          # after crossing, the front must enter the intersection this soon ...
      stop_speed_mps: 1.0         # ... without stopping after the line: below this speed ...
      stop_hold_sec: 1.0          # ... for this long (stop_line's stopped_sec) is stopping past the line
      lost_crossing_sec: 4.0      # a red runner lost soon after the line: the event lasts this long (SPEC §12.51)

  wrong_way:
    enabled: true
    min_score: 0.5
    merge_gap: 1.0
    min_dur: 0.5
    params:
      min_speed_mps: 2.0
      max_cos_to_lane: -0.5
      lateral_margin_m: 1.0      # the footprint must be this far inside the wrong lane (SPEC §12.42)
      min_sec: 1.0

  illegal_u_turn:
    enabled: false
    min_score: 0.5
    merge_gap: 1.0
    min_dur: 0.5
    params:
      min_heading_change_deg: 150.0
      window_sec: 12.0
      min_start_speed_mps: 1.0
      start_yaw_rate_dps: 10.0
      end_heading_tol_deg: 15.0
      end_stable_sec: 1.0

  stopped_vehicle:
    enabled: false
    min_score: 0.5
    merge_gap: 2.0
    min_dur: 10.0
    params:
      stop_speed_mps: 0.5
      min_stopped_sec: 10.0
      resume_speed_mps: 1.0
      resume_hold_sec: 1.0
      queue_upstream_m: 120.0     # red queues here run 60 m and more (SPEC §12.50)
      queue_ahead_m: 15.0         # one car missed by the detector must not break a queue
      queue_lateral_m: 2.0        # outside any lane: lined up along the vehicle's heading within this

  jaywalking:
    enabled: true
    min_score: 0.5
    merge_gap: 1.0
    min_dur: 1.0
    params:
      min_sec: 1.0
      rider_box_expand: 0.2
      rider_iou: 0.3
      in_vehicle_frac: 0.7
      kerb_buffer_m: 1.0         # clearly on the road: this far inside the carriageway and from islands (SPEC §12.42)
      crosswalk_buffer_m: 1.0    # ... and this far from every crosswalk
      max_walk_speed_mps: 3.0    # faster than this along the lane is riding ...
      along_lane_cos: 0.7        # ... 'along' = |cos(velocity, lane direction)| above this
      max_run_speed_mps: 6.0     # faster than anyone runs, in any direction
      rider_track_frac: 0.3      # a track matched to a two-wheeler this often is a rider throughout

  failure_to_yield:
    enabled: true
    min_score: 0.5
    merge_gap: 1.0
    min_dur: 0.5
    params:
      min_vehicle_speed_mps: 1.5
      ped_edge_dist_m: 1.0
      conflict_lateral_m: 3.0     # pedestrian within this distance of the vehicle's axis (own lane + half) ...
      conflict_ahead_m: 6.0       # ... and at most this far ahead of its front (SPEC §12.36)
      max_crossing_sec: 5.0       # on a crossing longer than this = waiting there, not driving through (SPEC §12.49)

  illegal_turn:
    enabled: false
    min_score: 0.5
    merge_gap: 1.0
    min_dur: 0.5
    params:
      start_yaw_rate_dps: 10.0
      end_heading_tol_deg: 15.0
      end_stable_sec: 1.0
      min_turn_deg: 45.0          # a movement with less heading change is not a turn

  solid_line_crossing:
    enabled: true
    min_score: 0.5
    merge_gap: 1.0
    min_dur: 0.5
    params:
      min_lateral_m: 1.0
      occluded_cover: 0.3        # a nearer vehicle's box over this share of the bottom edge hides the footprint

  stop_line:
    enabled: true
    min_score: 0.5
    merge_gap: 1.0
    min_dur: 0.5
    params:
      stop_speed_mps: 0.5
      stopped_sec: 1.0
      past_line_m: 2.0            # front bumper this far past the drawn line: the line sits ~0.5 m before the paint (SPEC §12.58)
      resume_speed_mps: 1.0       # moving again before green ends the event
      max_gap_sec: 3.0            # a stopped vehicle may be hidden (pedestrians) this long

  congestion:
    enabled: true                # 0 events on all three samples with every rule on (SPEC §12.57, §12.58)
    min_score: 0.5
    merge_gap: 5.0
    min_dur: 20.0
    params:
      step_sec: 1.0
      max_mean_speed_mps: 1.5
      min_vehicles_per_lane: 2
      min_sustain_sec: 20.0
      long_sec_unknown_signal: 90.0  # without lamp states a jam must outlast any plausible red (SPEC §12.41; set from the measured cycle)
      green_persist_sec: 10.0
      clear_speed_mps: 3.0
      clear_hold_sec: 5.0

  road_obstacle:
    enabled: true
    min_score: 0.5
    merge_gap: 1.0
    min_dur: 0.5
    params:
      coco_min_sec: 1.0
      background_window_sec: 30.0
      min_area_m2: 0.3
      box_expand: 0.2
      static_sec: 3.0
      static_speed_mps: 0.5    # a bag slower than this lies still
      gone_sec: 2.0
      ignore_classes: [bird]   # pigeons land and fly off: never an obstacle (SPEC §12.43)

  fire_smoke:                 # stays disabled unless an open fire/smoke model is shipped (SPEC §5)
    enabled: false
    min_score: 0.5
    merge_gap: 1.0
    min_dur: 0.5
    params:
      end_pad_sec: 1.0

risk:                         # SPEC §8 (Part B)
  stride: 3
  budget_factor: 0.6          # our step() compute may use this x video time; beyond it frames are skipped
  budget_slack_sec: 2.0       # (the harness decode, ~1-1.3x, and Part A, <= 1.2x, share the same 3x)
  total_budget_factor: 2.7    # Part A start + this x duration = the deadline Part B paces against (SPEC §12.40)
  pace_after_sec: 5.0         # project the finish only once this much video has been seen
  vel_window_sec: 0.8         # online velocity = least-squares slope of the positions in this window ...
  acc_window_sec: 1.0         # ... acceleration = slope of the velocities in this one
  min_fit_samples: 4
  min_fit_span_sec: 0.3
  min_mover_speed_mps: 3.0    # a conflict needs one party moving at least this fast ...
  min_track_age_sec: 1.0      # ... and both tracks at least this old
  decel_floor_mps2: 4.0       # braking below this is everyday driving, not a warning sign
  decel_min_age_sec: 1.5      # braking is read only from tracks this old (a new box's first fits are noise) ...
  decel_cap_mps2: 12.0        # ... and above this it is a measurement artefact, not braking (tyres give ~9)
  max_ground_m_per_px: 0.08   # no kinematics where one 4K-equivalent pixel is more ground than this (SPEC §12.47)
  max_plausible_speed_mps: 25.0  # 90 km/h at a signalised junction: faster means the track jumped vehicles
  max_pair_dist_m: 25.0
  min_closing_speed_mps: 1.0
  drac_min_mps2: 5.0          # a conflict needs emergency braking to stop short (SPEC §12.47); drivers here
  drac_min_person_mps2: 4.0   # ... stop behind the queue at 3-5 m/s^2. Facing a pedestrian: this
  min_conflict_closing_mps: 2.0
  max_conflict_ttc_sec: 4.0
  conflict_persist_frames: 3  # the same pair in conflict this many processed frames in a row (0.3 s at 10 Hz) ...
  conflict_gap_consistency: 0.5  # ... with its gap really shrinking at >= this share of the closing speed
  min_gap_m: 0.3              # bumper gaps are floored here (overlapping boxes, measurement noise)
  path_margin_m: 0.5          # crossing traffic is "in the path" within both half-widths plus this ...
  path_margin_person_m: 0.2   # ... a pedestrian within this (walking beside a car is not in its path)
  parallel_max_deg: 30.0      # traffic moving within this of a's line (either way) must overlap it laterally now
  conflict_radius_m: 2.5       # paths closer than this at their closest approach are a conflict (SPEC §12.39) ...
  conflict_radius_person_m: 2.0  # ... or this when a pedestrian is involved
  person_classes: [person]
  ttc_scale_sec: 1.5          # g(ttc) = exp(-ttc / ttc_scale_sec)
  closing_speed_norm_mps: 10.0
  decel_norm_mps2: 4.0         # deceleration above the floor, normalised: floor + 4 m/s^2 counts fully
  weights:                    # solved from SPEC §8's targets, then rounded (SPEC §12.32):
    bias: -3.0                # calm traffic -> sigmoid(-3) = 0.047 (< 0.05)
    ttc: 5.5                  # TTC 1.0 s at 6 m/s closing -> 0.60; TTC 3 s -> 0.16
    closing_speed: 1.0
    decel: 2.0
    wrong_way: 1.0
    red_light: 0.8            # a vehicle moving in a lane whose signal is red
    ped_ttc: 5.0
  ema_alpha: 0.4
  hold_sec: 1.0               # once >= threshold, hold for at least this long
  threshold: 0.5
